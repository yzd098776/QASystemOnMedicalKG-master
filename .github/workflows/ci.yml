name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Neo4j 5.26 服务容器，供契约测试与关键逻辑测试真实连库
    services:
      neo4j:
        image: neo4j:5.26
        ports:
          - 7687:7687
        env:
          NEO4J_AUTH: neo4j/citestpassword
          NEO4J_server_memory_heap_max__size: 1G
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20

    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: citestpassword
      # JWT_SECRET 不写死（避免命中 config 弱值校验，且公开仓库不放密钥字面量），
      # 改由下方步骤在运行时动态生成强随机值
      PROFILE_ENCRYPTION_KEY: ""
      DEEPSEEK_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装后端依赖（含测试）
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: 运行时生成 CI 专用强随机 JWT_SECRET
        # 生产密钥只存各自 .env；CI 仅需一个通过 config 强校验的临时值。
        # 过滤掉命中弱值特征（change-me/secret/123456/password/example/test）的随机串，保证不触发拒启。
        run: |
          while true; do
            K=$(python -c "import secrets;print(secrets.token_urlsafe(48))")
            echo "$K" | grep -qiE 'change-me|secret|123456|password|example|test' || break
          done
          echo "JWT_SECRET=$K" >> "$GITHUB_ENV"

      - name: 等待 Neo4j 就绪
        run: |
          for i in $(seq 1 30); do
            if python -c "from neo4j import GraphDatabase; GraphDatabase.driver('bolt://localhost:7687', auth=('neo4j','citestpassword')).verify_connectivity()" 2>/dev/null; then
              echo "Neo4j ready"; break;
            fi
            echo "waiting neo4j ($i)"; sleep 3;
          done

      - name: 建图并执行阶段二幂等迁移（为契约测试提供与本地一致的数据）
        run: |
          cd backend
          python ../build_medicalgraph.py
          python scripts/migrate_graph_phase2.py

      - name: 语法/静态检查（compileall 捕获语法错误与未定义导入路径的明显问题）
        run: |
          cd backend
          python -m compileall -q app.py core services scripts tests
          pip install ruff==0.6.9
          # 仅报告错误级问题；bare except(E722) 等项目已规避
          ruff check app.py core services tests --select E,F --ignore E501 || true

      - name: 运行测试套件（契约快照比对 + 关键逻辑回归）
        run: |
          cd backend
          python -m pytest tests/ -v
